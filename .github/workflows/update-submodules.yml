name: Update Submodules

on:
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    # Gerrit rejects cloud runners that send the default git user agent (T441387)
    env:
      GIT_HTTP_USER_AGENT: "mw-math-testing/1.0 (https://github.com/physikerwelt/mw-math-testing; wiki@physikerwelt.de)"
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out the submodules
        # actions/checkout replaces GIT_HTTP_USER_AGENT with its own, so git fetches the submodules
        run: git submodule update --init
      
      - name: Update submodules
        run: git submodule update --remote --merge

      - name: Commit and push changes
        id: push
        run: |
          BRANCH="update-submodules-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update submodules to latest remote HEAD"
            git push origin "$BRANCH"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.push.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            This PR updates all git submodules to their latest remote HEAD.

            Triggered by the [Update Submodules](https://github.com/${{ github.repository }}/actions/workflows/update-submodules.yml) workflow.
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.push.outputs.branch }}" \
            --title "Update submodules to latest remote HEAD" \
            --body "$PR_BODY"
